[package]
name = "armature-macros-utils"
version = "0.4.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-macros-utils"
homepage = "https://quinnjr.github.io/armature"
description = "Utility functions for Armature macros"
keywords = ["macros", "utilities", "framework"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full", "extra-traits"] }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
# The generated macro code targets these crates; tests exercise the real
# expansions, so they are pulled in as dev-dependencies only. Callers of the
# macros must depend on the same crates themselves (see the crate docs — in
# particular `validate_email!` requires the caller to depend on `regex`).
armature-core = { version = "0.10" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
trybuild = "1"

